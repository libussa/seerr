---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'CodeQL'

on:
  workflow_call:
    inputs:
      upstream_sha:
        description: Pinned upstream commit to test
        type: string
        required: false
        default: ''
      overlay_sha:
        description: French-dub PR commit whose overlay should be applied
        type: string
        required: false
        default: ''
      overlay_ref:
        description: PR branch ref for CodeQL result attribution
        type: string
        required: false
        default: ''
  push:
    branches: ['develop']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: ['develop']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '50 7 * * 5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.overlay_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.upstream_sha != '' && 'seerr-team/seerr' || github.repository }}
          ref: ${{ inputs.upstream_sha || github.sha }}
      - name: Apply the French-dub PR overlay
        if: inputs.overlay_sha != ''
        uses: libussa/seerr/.github/actions/apply-french-dub@0c6c9f83407e09e7fa38ca3c9c83a26b698dfd11
        with:
          overlay-sha: ${{ inputs.overlay_sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
          ref: ${{ inputs.overlay_ref || github.ref }}
          sha: ${{ inputs.overlay_sha || github.sha }}
