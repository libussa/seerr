name: doublage français image

on:
  workflow_dispatch:
  push:
    branches: [codex/french-dub-labels]
    paths:
      - docker-french-dub/**
      - .github/workflows/french-dub-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: french-dub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'libussa/seerr'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned upstream with display overlay
        env:
          IMAGE: ghcr.io/libussa/seerr-french-dub:${{ github.sha }}
        run: ./docker-french-dub/build.sh "$IMAGE"
      - name: Publish image
        env:
          IMAGE: ghcr.io/libussa/seerr-french-dub:${{ github.sha }}
        run: |
          version=$(docker run --rm --network none --entrypoint node "$IMAGE" -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable upstream version, got: $version" >&2
            exit 1
          fi
          version_image="ghcr.io/libussa/seerr-french-dub:$version"
          docker tag "$IMAGE" "$version_image"
          docker push "$IMAGE"
          docker push "$version_image"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Version tag: \`$version_image\`" >> "$GITHUB_STEP_SUMMARY"
