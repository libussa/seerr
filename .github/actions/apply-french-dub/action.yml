name: Apply the French-dub overlay
description: Apply a PR's overlay to an already checked-out upstream release
inputs:
  overlay-sha:
    description: Full commit SHA of the release PR in libussa/seerr
    required: true
runs:
  using: composite
  steps:
    - name: Install overlay tools in Alpine test containers
      shell: sh
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache git python3
        fi
    - name: Fetch and apply the exact PR overlay
      shell: sh
      env:
        OVERLAY_SHA: ${{ inputs.overlay-sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import re
        import subprocess
        import tempfile

        sha = os.environ['OVERLAY_SHA']
        if not re.fullmatch(r'[0-9a-f]{40}', sha):
            raise SystemExit('Expected a full overlay commit SHA')
        with tempfile.TemporaryDirectory(prefix='french-dub-overlay-') as directory:
            def git(*args):
                return subprocess.check_output(['git', '-C', directory, *args], text=True).strip()
            git('init', '-q')
            git('fetch', '--depth=1', 'https://github.com/libussa/seerr.git', sha)
            git('checkout', 'FETCH_HEAD', '--', 'docker-french-dub')
            overlay = Path(directory) / 'docker-french-dub'
            upstream = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            if (overlay / 'upstream-ref').read_text().strip() != upstream:
                raise SystemExit('Checked-out upstream does not match the PR pin')
            patch = str(overlay / 'french-original-ui.patch')
            subprocess.run(['git', 'apply', '--check', patch], check=True)
            subprocess.run(['git', 'apply', patch], check=True)
            subprocess.run(['python3', str(overlay / 'relabel.py'), os.getcwd()], check=True)
            subprocess.run(['git', 'diff', '--stat'], check=True)
        PY
